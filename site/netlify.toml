[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # The page runs its own inline script and talks to the API, the map tiles,
    # Privy and a wallet extension, so scripts are not pinned here; what is
    # pinned is what no page of ours ever needs: plugins, a rewritten base
    # URL, being framed by another site, and the device APIs except location.
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; frame-ancestors 'self'; upgrade-insecure-requests"
    Permissions-Policy = "camera=(), microphone=(), payment=(), usb=(), geolocation=(self)"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The desk an insurer runs its book on: the same source as the page above with
# nothing taken out, where that one is built without the three screens a buyer
# cannot open. It is a document, so it is checked every time like the other one.
[[headers]]
  for = "/desk.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Privy's sign in window, fetched only when someone presses the button. The
# chunks are named by their content, so they can be kept forever; the entry
# file is not, so it is always checked.
[[headers]]
  for = "/privy/c-*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/privy/privy.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The build's name, asked for by tabs that have been open a while. It must
# never be cached: a stale answer to "has this changed?" is the one answer
# that is always wrong.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"

# A path somebody typed or pasted, sent to the view it names.
#
# The page routes on the fragment, so every screen's address is
# clause.insure/#/proof. Nobody writes it that way. A link in a message, a
# line read out, a path remembered from the address bar: all of them arrive
# as clause.insure/proof, and all of them used to arrive at the host's own
# "Page not found", which from outside is a site that is broken rather than a
# site whose addresses have a # in them.
#
# Found 302 rather than moved 301, because this is where these screens live
# today and not a promise about where they live: a permanent redirect sits in
# the browser's cache and would outlast the decision.
#
# The routes are the ones in VIEWS, and a test fails if the two drift apart.

[[redirects]]
  from = "/cover"
  to = "/#/cover"
  status = 302

