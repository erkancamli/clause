# A version bump on main publishes its release notes.
#
# The notes and the changelog are the same words; writing them twice is how
# they come apart, and the copy on GitHub is the one nobody remembers to
# update. So the version is read from the source, its section is read out of
# CHANGELOG.md, and the release is created with the tag it needs. A version
# that already has a release is left alone, so an ordinary push does nothing.
#
# It holds no secrets and reaches nothing outside this repository: the only
# credential is the token GitHub mints for the run, scoped to writing a
# release here.
name: release

on:
  push:
    branches: [main]
    paths:
      - "clause/__init__.py"
      - "CHANGELOG.md"
  # A workflow is only picked up once it is on the default branch, so the
  # version that introduces one is always the version it misses. This is how
  # that one gets published, and how any release can be re-run by hand.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: what version is this
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import clause; print(clause.__version__)')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: has it been released already
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG is already released"
            echo "NEW=0" >> "$GITHUB_ENV"
          else
            echo "NEW=1" >> "$GITHUB_ENV"
          fi

      - name: publish
        if: env.NEW == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/release_notes.py "$VERSION" > notes.md
          cat notes.md
          gh release create "$TAG" \
            --title "Clause $VERSION" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --repo "$GITHUB_REPOSITORY"
