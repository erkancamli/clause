# Run by hand from the Actions tab: the service's state and its last log
# lines, read over the same SSH the deploy uses. Nothing here changes the
# server, and no secret is printed.
name: diagnose

on:
  workflow_dispatch:
    inputs:
      lines:
        description: how many log lines to show
        default: "400"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 5m
          script: |
            echo "==> service"; sudo systemctl status clause --no-pager --lines=0 || true
            echo "==> version"; curl -s --max-time 5 http://127.0.0.1:8080/api/health | head -c 300; echo
            echo "==> quote"; curl -s --max-time 60 -o /tmp/q.json -w "status %{http_code} in %{time_total}s\n" -X POST http://127.0.0.1:8080/api/quote -H 'content-type: application/json' -d '{"peril":"earthquake","subject":{"location":"IST-KADIKOY","radius_km":50},"limit":50000,"term_days":365}'; head -c 300 /tmp/q.json; echo
            echo "==> storm quote"; curl -s --max-time 60 -o /tmp/s.json -w "status %{http_code} in %{time_total}s\n" -X POST http://127.0.0.1:8080/api/quote -H 'content-type: application/json' -d '{"peril":"storm","subject":{"latitude":41.02,"longitude":28.77,"place":"test"},"limit":37327,"term_days":365}'; head -c 300 /tmp/s.json; echo
            echo "==> book"; curl -s --max-time 30 "http://127.0.0.1:8080/api/policies?limit=1" | head -c 200; echo
            echo "==> models"; ls -la /opt/clause/clause/hazard/models/ | tail -3
            echo "==> log"; sudo journalctl -u clause -n "${{ github.event.inputs.lines }}" --no-pager
