# nginx in front of the protocol. Installed at
# /etc/nginx/sites-available/clause and linked into sites-enabled.
#
# Three jobs: terminate TLS, rate limit before the application spends anything
# on a request, and pass the client's address through so the application's own
# limiter sees callers rather than nginx.

# Two zones, because the work behind these routes differs by orders of
# magnitude. A quote runs a Monte Carlo over the whole book; reading a page of
# blocks does not.
limit_req_zone $binary_remote_addr zone=clause_quote:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=clause_read:10m rate=240r/m;
limit_conn_zone $binary_remote_addr zone=clause_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name api.clause.insure;

    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.clause.insure;

    ssl_certificate     /etc/letsencrypt/live/api.clause.insure/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.clause.insure/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # This host serves JSON to a browser application; its own front page is a
    # plain redirect to the site, so nothing here needs to execute.
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    server_tokens off;
    client_max_body_size 32k;      # every request here is a small JSON body, but see /api/carriers
    client_body_timeout 10s;
    send_timeout 30s;

    # No more than this many simultaneous connections from one address, which
    # is what stops one client holding open a pile of event streams.
    limit_conn clause_conn 12;

    # Pricing: the expensive path.
    location = /api/quote {
        limit_req zone=clause_quote burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # The other pricing paths: offers from every company, the contract text
    # (both price the cover), a partner's quote.
    location ~ ^/api/(offers|contract|partner/v1/quote)$ {
        limit_req zone=clause_quote burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # Buying and capital: rare, and each one already carries a signature.
    location ~ ^/api/(policies|applications|rider/purchase|partner/v1/policies|pool/(deposit|withdraw))$ {
        limit_req zone=clause_quote burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # A company registering may attach up to four documents of 3 MB, base64
    # encoded inside the JSON, so this one route takes a larger body.
    location = /api/carriers {
        client_max_body_size 18m;
        limit_req zone=clause_quote burst=3 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }

    # The live feed. Buffering must be off or events arrive in clumps.
    location = /api/stream {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        chunked_transfer_encoding off;
    }

    location / {
        limit_req zone=clause_read burst=40 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
    }
}
